[package]
name = "cosmic-applet-datetime-plus"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "COSMIC clock with notifications, calendar, media, world clocks and weather"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["applet", "a11y", "dbus-config"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
iana-time-zone = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "sync", "time", "rt-multi-thread"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }
futures-util = { version = "0.3", features = ["sink"] }
libc = "0.2"
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
roxmltree = "0.20"
notify = "8.2"
unicode-normalization = "0.1"
